# ~/docker/nginx/conf.d/[SERVICE].conf
# Template for new service on x-server. Two halves:
#   1. HTTP-only block — required FIRST so certbot can complete the ACME challenge
#   2. HTTPS block — uncomment AFTER certbot issues the cert
#
# Replace placeholders:
#   [DOMAIN]         e.g. app.example.net
#   [UPSTREAM_HOST]  the docker container name (e.g. myapp, kids-app-kids)
#   [UPSTREAM_PORT]  the container's internal port (e.g. 3000, 8080)
#   [SERVICE]        kebab-case name (matches the conf filename)

# ───────────────────────────────────────────────────────────────────────────────
# PHASE 1 — HTTP-only (issue cert with certbot --webroot, then add Phase 2)
# ───────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name [DOMAIN];

    # ACME challenge — certbot writes here via shared volume
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # During Phase 1: serve a placeholder or redirect everything else
    # During Phase 2: this whole non-ACME block becomes a 301 to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

